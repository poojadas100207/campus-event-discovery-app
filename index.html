<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Pulse | Modern Campus Event Discovery</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23263D52%22/><text x=%2250%25%22 y=%2255%25%22 font-size=%2252%22 font-family=%22sans-serif%22 font-weight=%22bold%22 fill=%22%23D9825B%22 dominant-baseline=%22central%22 text-anchor=%22middle%22>CP</text></svg>" />

    <!-- Typography: Plus Jakarta Sans / Manrope for Headings, Inter for Body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: {
                DEFAULT: '#263D52',
              },
              charcoal: {
                DEFAULT: '#202B36',
              },
              offwhite: {
                DEFAULT: '#F8F7F4',
              },
              coral: {
                DEFAULT: '#D9825B',
              },
              dustyblue: {
                DEFAULT: '#A9BEC4',
              },
              warmbeige: {
                DEFAULT: '#E8D8C5',
              },
              slategrey: {
                DEFAULT: '#777D80',
              }
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
              display: ['"Plus Jakarta Sans"', 'Manrope', 'Inter', 'sans-serif'],
            },
            boxShadow: {
              'subtle': '0 1px 3px rgba(32, 43, 54, 0.04), 0 1px 2px rgba(32, 43, 54, 0.02)',
              'card': '0 2px 8px rgba(38, 61, 82, 0.06), 0 1px 2px rgba(38, 61, 82, 0.04)',
              'card-hover': '0 8px 20px rgba(38, 61, 82, 0.09), 0 2px 5px rgba(38, 61, 82, 0.04)',
              'modal': '0 20px 40px -10px rgba(32, 43, 54, 0.22)',
            },
            animation: {
              'fade-in': 'fadeIn 0.2s ease-out',
              'slide-up': 'slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1)',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(8px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>

    <!-- Custom Styling: Modern Campus Theme -->
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body class="bg-[#F8F7F4] text-[#202B36] font-sans antialiased selection:bg-[#D9825B] selection:text-white min-h-screen overflow-x-hidden">
    
    <!-- Root Container for Application State -->
    <div id="root">
      <!-- Loading Shell -->
      <div class="min-h-screen flex items-center justify-center bg-[#F8F7F4]">
        <div class="flex flex-col items-center gap-3">
          <div class="w-12 h-12 rounded-xl bg-[#263D52] flex items-center justify-center text-xl font-bold text-[#D9825B] shadow-sm">
            CP
          </div>
          <div class="text-xs font-semibold text-[#777D80] tracking-wide uppercase">Campus Pulse</div>
        </div>
      </div>
    </div>

    <!-- Application Script (Works both via server and direct double-click) -->
    <script src="./bundle.js"></script>
  </body>
</html>
